services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      # No `:-default` fallbacks: compose must refuse to start rather than boot a
      # database whose credentials are guessable from this repository.
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env, see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      # Read by init-test-db.sh: production has no pytest run against it, so
      # the init script skips creating the unused sibling *_test database.
      APP_ENV: ${APP_ENV:-local}
    ports:
      # Loopback only: the dev database must not be reachable from the network.
      # The host port is configurable because 5432 is often taken by another postgres.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    # `image:` alongside `build:` lets the same file serve two roles: local dev
    # and cd-stand.yml build from source (`build:`), while cd.yml builds once on
    # a hosted runner, pushes to GHCR, and the prod server only ever pulls the
    # named tag — no repo source or build toolchain needed on that box.
    image: ghcr.io/dezodemius/dndshing-api:${IMAGE_TAG:-local}
    build: .
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-local}
      # Built from POSTGRES_*, the single source of truth for the credentials, and
      # not taken from DATABASE_URL in .env: that one points at localhost for the
      # host-side alembic/pytest runs, while the container reaches postgres as `db`.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST in .env, see .env.example}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:?set FRONTEND_BASE_URL in .env, see .env.example}
      # Optional: unset keeps the Yandex OAuth provider disabled (rule 12 does
      # not apply here — this is not a required-to-boot secret).
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
      YANDEX_REDIRECT_URI: ${YANDEX_REDIRECT_URI:-}
      # Optional: unset keeps the Mail.ru OAuth provider disabled, same as above.
      MAILRU_CLIENT_ID: ${MAILRU_CLIENT_ID:-}
      MAILRU_CLIENT_SECRET: ${MAILRU_CLIENT_SECRET:-}
      MAILRU_REDIRECT_URI: ${MAILRU_REDIRECT_URI:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Parameterized like the other services: a single host (see cd.yml/
      # cd-stand.yml) can run both the stand and prod compose projects side by
      # side, provided each .env picks a distinct *_HOST_PORT.
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"

  frontend:
    # Multi-stage build: the SPA is compiled here and served by nginx, which also
    # proxies /api/v1 to `api` so the browser talks to a single origin.
    image: ghcr.io/dezodemius/dndshing-frontend:${IMAGE_TAG:-local}
    build:
      context: ./frontend
      args:
        APP_COMMIT_SHA: ${APP_COMMIT_SHA:-dev}
    # No container_name: it's a Docker-daemon-global name, not scoped by
    # compose project, so a pinned name would collide the moment two projects
    # sharing this file (stand + prod, on the same app01 host) both start a
    # frontend container. The default `<project>-frontend-1` is already
    # namespaced by directory (dnd-stand vs dnd-prod) and every health check
    # already addresses this service by its compose service name, not by
    # container name, so nothing depends on the fixed one.
    restart: unless-stopped
    depends_on:
      # nginx resolves the `api` hostname when it loads its config and exits if
      # the name is missing, so the container has to exist before this one starts.
      api:
        condition: service_started
    ports:
      # Loopback only, like the rest: in production Cloudflare and the host proxy
      # are what face the network. The host port stays off 5173 so a `npm run dev`
      # can run alongside this container.
      - "127.0.0.1:${FRONTEND_HOST_PORT:-8080}:80"

volumes:
  pg_data:
