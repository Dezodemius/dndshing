server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The bundle calls the API at a relative /api/v1, so browser and API share one
    # origin: no CORS, no preflight, and the httpOnly refresh cookie is first-party.
    # No trailing path on proxy_pass — the backend mounts its routers under the same
    # /api/v1 prefix (app/main.py), so the URI passes through unchanged.
    location /api/v1/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Liveness for the edge and uptime checks. The admin surface the backend also
    # exposes (/internal/admin/...) is deliberately left unproxied: it has no
    # business being reachable from the public origin.
    location = /healthz {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite fingerprints asset filenames, so a changed file is always a new URL and
    # the old one can be cached indefinitely. Single header, no `expires`, which
    # would emit a second, weaker Cache-Control alongside this one.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The entry point must never be cached: it is what points at the current
    # asset hashes, and a stale copy pins the browser to a deleted bundle.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routing: an unknown path is a React Router route to be resolved
    # in the browser, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
