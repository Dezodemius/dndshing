# .github/workflows/ci.yml
#
# Обязательный чек на каждый PR в develop: линт и тесты backend, typecheck
# и build фронта. Красный чек на падающем тесте/линте/сборке — сигнал
# ревьюеру и merge-гейт после включения required status check в настройках
# репозитория.

name: ci

on:
  pull_request:
    branches: [develop]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          # Ephemeral-креды только для этого контейнера CI, живут в рамках
          # одного job-рана — не секрет проекта и не пересекаются с .env/compose.
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: dndshing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d dndshing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/dndshing
      TEST_DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/dndshing_test
      # Ephemeral, job-scoped secret — same rationale as POSTGRES_PASSWORD above.
      JWT_SECRET_KEY: ci-test-secret-not-a-real-credential

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Create test database
        # Сервис-контейнер стартует до checkout, поэтому init-скрипт
        # docker/postgres/init-test-db.sh (docker-entrypoint-initdb.d) сюда
        # не примонтировать — создаём тестовую БД отдельным шагом.
        env:
          PGPASSWORD: ci
        run: psql -h localhost -U ci -d dndshing -c "CREATE DATABASE dndshing_test"

      - name: Test
        run: pytest

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck + build
        run: npm run build
