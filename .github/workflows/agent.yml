# .github/workflows/agent.yml  (v3)
#
# Автономный агент. Работает в облаке GitHub — локальная машина не нужна.
# Ветки: feat/dnd-NNN от develop, PR в develop. Прод деплоится только
# при merge develop -> main (отдельный CD-воркфлоу, секреты прода
# агентскому воркфлоу недоступны).
#
# Подготовка: доки проекта — в .claude/docs/, конвенции — в .claude/skills/

name: agent

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
    inputs:
      issue:
        description: "Номер ишью (пусто = выбрать автоматически)"
        required: false

concurrency:
  group: agent
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write   # claude-code-action@v1 обменивает OAuth-токен через OIDC

jobs:
  pick:
    runs-on: ubuntu-latest
    outputs:
      issue: ${{ steps.pick.outputs.issue }}
    steps:
      - uses: actions/checkout@v4
      - name: Pick next ready issue
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          FORCED: ${{ inputs.issue }}
        run: |
          set -euo pipefail
          if [ -n "${FORCED:-}" ]; then
            echo "issue=$FORCED" >> "$GITHUB_OUTPUT"; exit 0
          fi
          busy=$(gh issue list --label in-progress --state open --json number --jq 'length')
          if [ "$busy" != "0" ]; then
            echo "In-progress issue exists, skipping run."
            echo "issue=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Зависимости здесь не проверяются: метку agent-ready ставит
          # plan.yml по графу `depends:` из BACKLOG. Раньше на этом месте был
          # grep DND-\d+ по телу ишью — он принимал за зависимость любое
          # упоминание задачи в прозе (напр. в разделе «Вне скоупа»).
          picked=$(gh issue list --label agent-ready --state open \
                    --json number,title --jq 'sort_by(.title) | .[0].number // empty')
          echo "issue=$picked" >> "$GITHUB_OUTPUT"

  run:
    needs: pick
    if: needs.pick.outputs.issue != ''
    runs-on: ubuntu-latest
    env:
      ISSUE: ${{ needs.pick.outputs.issue }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      # Падаем до запуска агента, а не после: иначе прогон сжигает ~4 минуты
      # и ~$1, чтобы упасть на git push в самом конце.
      - name: Check GH_PAT can push workflow files
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          # Классический PAT отдаёт свои scope в заголовке x-oauth-scopes.
          # Fine-grained PAT его не отдаёт — там проверить нечем, пропускаем.
          scopes=$(curl -sS -o /dev/null -D - \
                     -H "Authorization: Bearer $GH_PAT" \
                     -H "X-GitHub-Api-Version: 2022-11-28" \
                     https://api.github.com/user \
                   | tr -d '\r ' | sed -n 's/^[Xx]-[Oo][Aa]uth-[Ss]copes://p')
          if [ -z "$scopes" ]; then
            echo "::notice::GH_PAT не классический — scope не видны, проверка пропущена."
            exit 0
          fi
          case ",$scopes," in
            *,workflow,*)
              echo "GH_PAT has workflow scope ($scopes)." ;;
            *)
              echo "::error::У GH_PAT нет scope 'workflow' (есть: $scopes). Задачи, меняющие .github/workflows/, не запушатся. Перевыпусти PAT со scope repo+workflow и обнови секрет."
              exit 1 ;;
          esac

      - name: Mark in-progress
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue edit "$ISSUE" --add-label in-progress

      - name: Run Claude Code on the issue
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # PAT (нужен scope `workflow`), а не токен GitHub App: приложениям
          # GitHub запрещает пушить изменения внутри .github/workflows/ без
          # разрешения `workflows`, а выдать его через блок `permissions:`
          # нельзя — такого ключа у GITHUB_TOKEN нет. Без этого любая задача,
          # трогающая воркфлоу (напр. DND-002), падает на git push с
          # «refusing to allow a GitHub App to create or update workflow».
          # Действует именно здесь: action затирает креды actions/checkout
          # своим токеном (configureGitAuth), поэтому token: у checkout не помог бы.
          github_token: ${{ secrets.GH_PAT }}
          prompt: |
            Выполни задачу из GitHub issue #${{ env.ISSUE }} строго по фазам.

            ФАЗА 1 — РАЗВЕДКА. Прочитай: issue (gh issue view ${{ env.ISSUE }}),
            .claude/docs/CLAUDE.md (правила и DoD), .claude/docs/REQUIREMENTS.md,
            .claude/docs/ARCHITECTURE.md, секцию задачи в .claude/docs/BACKLOG.md
            и АКТУАЛЬНЫЙ код модулей, которых касается задача. Скиллы-конвенции (.claude/skills/) применяй по
            их описаниям. Если задача противоречит текущему коду или docs —
            остановись: напиши блокер комментарием в issue, сними метку
            in-progress (gh issue edit --remove-label) и заверши работу.

            ФАЗА 2 — ПЛАН. Напиши комментарий к issue: файлы, которые
            изменишь; новые эндпоинты/модели; план тестов; принятые
            допущения. Коротко, списком.

            ФАЗА 3 — РЕАЛИЗАЦИЯ. Ветка feat/dnd-NNN (номер из issue) от
            свежего develop. Только скоуп задачи: ничего из «Вне скоупа»
            и фазы 2 (BR §6). Коммиты атомарные, сообщения на английском.

            ФАЗА 4 — САМОРЕВЬЮ. Прогони полный diff против: критериев
            приёмки задачи; DoD из .claude/docs/CLAUDE.md; скилла security-review;
            скилла code-style. Запусти тесты и линт, добейся зелёного.
            Найденное — исправь сейчас.

            ФАЗА 5 — ОФОРМЛЕНИЕ. Запиши тело PR в файл .claude/pr-body.md:
            Что сделано / Как проверял (тесты + ручные шаги) / Решения и
            допущения / Что НЕ вошло и почему. Файл в .gitignore — он лишь
            передаёт текст следующему шагу workflow, НЕ коммить его и не
            добавляй через git add -f. Запушь ветку с кодом задачи.
            Сам PR НЕ создавай — его создаст workflow.
          # Модель прибита явно, а не оставлена на дефолт: разработку ведёт
          # Sonnet (~$1 за прогон), Opus стоит только в ревью (review.yml) —
          # там он ловит баги и окупается. Если дефолт action однажды
          # переедет на модель подороже, без этого флага стоимость каждой
          # задачи молча вырастет в разы.
          claude_args: "--max-turns 100 --model claude-sonnet-5 --dangerously-skip-permissions"

      - name: Open PR into develop
        env:
          # PAT (not github.token): PR-события от github.token не триггерят
          # pull_request-воркфлоу, поэтому review.yml иначе не запустится.
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          title=$(gh issue view "$ISSUE" --json title --jq .title)
          dnd=$(printf '%s' "$title" | grep -oE '^DND-[0-9]+' | tr 'A-Z' 'a-z')
          branch="feat/${dnd}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            # Тело PR агент оставляет в .claude/pr-body.md прямо в workspace
            # (файл в .gitignore). Шаги идут в одном job — читаем его с диска,
            # а не из ветки: в git такой файл коммитить незачем.
            body_file=$(mktemp)
            if [ -s .claude/pr-body.md ]; then
              cat .claude/pr-body.md > "$body_file"
              printf '\n\nCloses #%s' "$ISSUE" >> "$body_file"
            else
              printf 'Closes #%s. (Агент не оставил описание — смотреть diff.)' "$ISSUE" > "$body_file"
            fi
            gh pr create --base develop --head "$branch" --title "$title" \
              --body-file "$body_file" || echo "PR already exists"
          else
            echo "Branch $branch not found — agent stopped or failed."
            gh issue edit "$ISSUE" --remove-label in-progress || true
            gh issue comment "$ISSUE" --body "Запуск без результата: ветка $branch не запушена. Смотри лог workflow и комментарии выше."
            exit 1
          fi