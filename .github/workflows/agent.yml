# .github/workflows/agent.yml  (v4)
#
# Автономный агент. Работает в облаке GitHub — локальная машина не нужна.
# Ветки: feat/dnd-NNN от develop, PR в develop. Прод деплоится только
# при merge develop -> main (отдельный CD-воркфлоу, секреты прода
# агентскому воркфлоу недоступны).
#
# НОЧНОЙ ЦИКЛ. Один прогон = одна задача. Cron будит воркфлоу каждые 20 минут
# внутри ночного окна, concurrency выстраивает прогоны в очередь по одному —
# получается «задача за задачей, пока не кончится ночь или квота». Упор в лимит
# модели = падение шага: задача помечается agent-deferred и выбывает до утра,
# следующий прогон берёт другую (если лимит общий — тоже упадёт и выбудет,
# ночь просто закончится раньше). Метку снимет ночной plan.yml — «сделаем завтра».
#
# Окно — 00:00–05:59 UTC (03:00–08:59 MSK). Меняешь — меняй В ДВУХ местах:
# cron ниже и NIGHT_END_UTC.
#
# Подготовка: доки проекта — в .claude/docs/, конвенции — в .claude/skills/

name: agent

on:
  schedule:
    - cron: "*/20 0-5 * * *"
  workflow_dispatch:
    inputs:
      issue:
        description: "Номер ишью (пусто = выбрать автоматически)"
        required: false

# Прогоны не отменяют друг друга, а ждут: пока агент пишет код, разбуженные
# cron'ом прогоны стоят в очереди (GitHub держит один pending, лишние гасит).
# Освободился — следующий стартует сразу. Отсюда и берётся «непрерывность».
concurrency:
  group: agent
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write   # claude-code-action@v1 обменивает OAuth-токен через OIDC

env:
  # Конец ночного окна (час UTC). Прогон, вытолкнутый очередью за эту границу,
  # новую задачу не берёт: днём квота нужна человеку.
  NIGHT_END_UTC: "6"
  # Потолок открытых PR агента. Задачи ночи независимы (граф depends это
  # гарантирует), но ветки режутся от develop и друг друга не видят — чем
  # больше их висит, тем выше шанс конфликта миграций и общих файлов.
  # Это же тормоз очереди: разгребли утром — ночью поедет дальше.
  MAX_OPEN_PRS: "3"
  # Стоп-кран ночи. Отличить «кончилась квота» от «задача сломана» по логу
  # нельзя, но две сорванные задачи подряд — это почти наверняка лимит, а не
  # совпадение: без тормоза агент до утра перебрал бы весь бэклог, роняя прогон
  # за прогоном и засыпая ишью комментариями. Счётчик — сами метки
  # agent-deferred; ночной plan.yml их снимает, так что он обнуляется сам.
  MAX_DEFERRED: "2"

jobs:
  pick:
    runs-on: ubuntu-latest
    outputs:
      issue: ${{ steps.pick.outputs.issue }}
    steps:
      - uses: actions/checkout@v4

      - name: Ensure queue labels exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create in-review --color 1D76DB \
            --description "PR открыт, ждёт ревью и мержа" || true
          gh label create agent-deferred --color FBCA04 \
            --description "Прогон сорвался (лимит/таймаут/ошибка) — вернуть в очередь следующей ночью" || true

      - name: Pick next ready issue
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          FORCED: ${{ inputs.issue }}
        run: |
          set -euo pipefail
          if [ -n "${FORCED:-}" ]; then
            echo "issue=$FORCED" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # Прогон мог простоять в concurrency-очереди за длинной задачей и
          # доехать до утра. Новую задачу он уже не берёт.
          # 10#: date отдаёт "08", а для арифметики bash это битая восьмеричка.
          hour=$(( 10#$(date -u +%H) ))
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$hour" -ge "$NIGHT_END_UTC" ]; then
            echo "Ночное окно закрыто (сейчас ${hour}:xx UTC) — прогон пропущен."
            echo "issue=" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # Живая метка in-progress при работающей concurrency-группе означает
          # прогон, умерший без уборки. Лезть поверх него нельзя.
          busy=$(gh issue list --label in-progress --state open --json number --jq 'length')
          if [ "$busy" != "0" ]; then
            echo "Есть in-progress — прошлый прогон не убрал за собой. Пропускаю."
            echo "issue=" >> "$GITHUB_OUTPUT"; exit 0
          fi

          deferred=$(gh issue list --label agent-deferred --state open --json number --jq 'length')
          if [ "$deferred" -ge "$MAX_DEFERRED" ]; then
            echo "Сорвалось задач за ночь: $deferred (потолок $MAX_DEFERRED) — похоже на лимит модели. Ночь окончена."
            echo "issue=" >> "$GITHUB_OUTPUT"; exit 0
          fi

          open_prs=$(gh pr list --base develop --state open --json headRefName \
                      --jq '[.[] | select(.headRefName | startswith("feat/dnd-"))] | length')
          if [ "$open_prs" -ge "$MAX_OPEN_PRS" ]; then
            echo "Открытых PR агента: $open_prs (потолок $MAX_OPEN_PRS) — жду мержа."
            echo "issue=" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # Зависимости здесь не проверяются: метку agent-ready ставит plan.yml
          # по графу `depends:` из BACKLOG. Раньше на этом месте был grep DND-\d+
          # по телу ишью — он принимал за зависимость любое упоминание задачи
          # в прозе (напр. в разделе «Вне скоупа»).
          #
          # Из очереди выбывают: in-progress (кто-то делает), in-review (сделана,
          # PR ждёт человека — agent-ready с неё снимет только закрытие ишью)
          # и agent-deferred (сорвалась этой ночью, повтор — завтра).
          # Фильтр по списку меток, а не через --search: поисковый индекс GitHub
          # отстаёт на секунды-минуты, и прогон, стартовавший сразу за прошлым,
          # увидел бы старые метки и взял ту же задачу второй раз.
          picked=$(gh issue list --label agent-ready --state open --limit 100 \
                    --json number,title,labels \
                    --jq '[ .[] | select([.labels[].name]
                              | any(. == "in-progress" or . == "in-review" or . == "agent-deferred")
                              | not) ]
                          | sort_by(.title) | .[0].number // empty')
          if [ -z "$picked" ]; then
            echo "Свободных agent-ready задач нет."
          else
            echo "Взял ишью #$picked."
          fi
          echo "issue=$picked" >> "$GITHUB_OUTPUT"

  run:
    needs: pick
    if: needs.pick.outputs.issue != ''
    runs-on: ubuntu-latest
    # Зависший агент держал бы concurrency-группу дефолтные 6 часов и съел бы
    # всю ночь. Час — потолок здоровой задачи; дольше — это уже не задача.
    timeout-minutes: 60
    env:
      ISSUE: ${{ needs.pick.outputs.issue }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Mark in-progress
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue edit "$ISSUE" --add-label in-progress

      - name: Run Claude Code on the issue
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Выполни задачу из GitHub issue #${{ env.ISSUE }} строго по фазам.

            ФАЗА 1 — РАЗВЕДКА. Прочитай: issue (gh issue view ${{ env.ISSUE }}),
            .claude/docs/CLAUDE.md (правила и DoD), .claude/docs/REQUIREMENTS.md,
            .claude/docs/ARCHITECTURE.md, секцию задачи в .claude/docs/BACKLOG.md
            и АКТУАЛЬНЫЙ код модулей, которых касается задача. Скиллы-конвенции (.claude/skills/) применяй по
            их описаниям. Если задача противоречит текущему коду или docs —
            остановись: напиши блокер комментарием в issue, сними метку
            in-progress (gh issue edit --remove-label) и заверши работу.

            ФАЗА 2 — ПЛАН. Напиши комментарий к issue: файлы, которые
            изменишь; новые эндпоинты/модели; план тестов; принятые
            допущения. Коротко, списком.

            ФАЗА 3 — РЕАЛИЗАЦИЯ. Ветка feat/dnd-NNN (номер из issue) от
            свежего develop. Только скоуп задачи: ничего из «Вне скоупа»
            и фазы 2 (BR §6). Коммиты атомарные, сообщения на английском.
            У соседних задач той же ночи могут висеть НЕ вмёрженные PR — их
            кода в develop нет, рассчитывать на него нельзя.

            ФАЗА 4 — САМОРЕВЬЮ. Прогони полный diff против: критериев
            приёмки задачи; DoD из .claude/docs/CLAUDE.md; скилла security-review;
            скилла code-style. Запусти тесты и линт, добейся зелёного.
            Найденное — исправь сейчас.

            ФАЗА 5 — ОФОРМЛЕНИЕ. Запиши тело PR в файл .claude/pr-body.md:
            Что сделано / Как проверял (тесты + ручные шаги) / Решения и
            допущения / Что НЕ вошло и почему. Файл в .gitignore — он лишь
            передаёт текст следующему шагу workflow, НЕ коммить его и не
            добавляй через git add -f. Запушь ветку с кодом задачи.
            Сам PR НЕ создавай — его создаст workflow.
          claude_args: "--max-turns 100 --dangerously-skip-permissions"

      - name: Open PR into develop
        env:
          # PAT (not github.token): PR-события от github.token не триггерят
          # pull_request-воркфлоу, поэтому review.yml иначе не запустится.
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          title=$(gh issue view "$ISSUE" --json title --jq .title)
          dnd=$(printf '%s' "$title" | grep -oE '^DND-[0-9]+' | tr 'A-Z' 'a-z')
          branch="feat/${dnd}"
          if ! git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            # Агент упёрся в блокер или сломался. Метки и комментарий — в шаге
            # уборки ниже, он ловит и этот случай.
            echo "Ветка $branch не запушена — агент остановился."
            exit 1
          fi
          # Тело PR агент оставляет в .claude/pr-body.md прямо в workspace
          # (файл в .gitignore). Шаги идут в одном job — читаем его с диска,
          # а не из ветки: в git такой файл коммитить незачем.
          body_file=$(mktemp)
          if [ -s .claude/pr-body.md ]; then
            cat .claude/pr-body.md > "$body_file"
            printf '\n\nCloses #%s' "$ISSUE" >> "$body_file"
          else
            printf 'Closes #%s. (Агент не оставил описание — смотреть diff.)' "$ISSUE" > "$body_file"
          fi
          gh pr create --base develop --head "$branch" --title "$title" \
            --body-file "$body_file" || echo "PR already exists"
          # Задача сдана, дальше ход человека. Не снять in-progress здесь =
          # очередь стоит до утреннего мержа, и вся ночь уходит на одну задачу.
          # Снятие и навешивание — разными вызовами и именно в таком порядке:
          # gh падает целиком, если метки нет в репозитории, и одним вызовом
          # отказ in-review утащил бы за собой снятие in-progress — то есть
          # заклинил очередь. Порядок выбирает меньшее зло: если упадёт второй
          # вызов, задачу в худшем случае возьмут заново (PR уже открыт, шаг
          # идемпотентен), а не потеряют очередь до ручной правки.
          gh issue edit "$ISSUE" --remove-label in-progress
          gh issue edit "$ISSUE" --add-label in-review

      - name: Release the issue if the run went wrong
        # cancelled() ловит и срабатывание timeout-minutes.
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Упор в лимит модели, таймаут, падение, блокер — всё сюда. in-progress
          # обязана слететь: иначе pick следующего прогона решит, что агент ещё
          # работает, и очередь встанет насовсем — не до утра, а до правки руками.
          # Поэтому отдельным вызовом и первой (см. шаг «Open PR» о том, как gh
          # роняет весь edit из-за одной незаведённой метки).
          gh issue edit "$ISSUE" --remove-label in-progress || true
          # agent-deferred выводит задачу из очереди на остаток ночи, чтобы
          # следующие прогоны не долбились в ту же стену. Снимет её ночной
          # plan.yml (--clear-deferred) — это и есть «сделаем завтра».
          gh issue edit "$ISSUE" --add-label agent-deferred || true
          gh issue comment "$ISSUE" --body "Прогон агента сорвался (лимит модели, таймаут или ошибка) — задача отложена до следующей ночи. Лог: $RUN_URL"
