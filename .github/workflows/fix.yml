name: fix

on:
  issue_comment:
    types: [created]

concurrency:
  group: fix-dispatch-${{ github.event.issue.number }}
  cancel-in-progress: false

# This privileged event never checks out or executes PR code. It only validates
# an owner command, pins the current immutable PR SHA, and dispatches the worker.
permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: read

jobs:
  dispatch:
    if: >-
      github.event.issue.pull_request != null &&
      github.event.issue.state == 'open' &&
      github.event.comment.user.type != 'Bot' &&
      github.event.comment.author_association == 'OWNER' &&
      (startsWith(github.event.comment.body, 'исправить') || startsWith(github.event.comment.body, '/fix'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.issue.number }}
      COMMENT_ID: ${{ github.event.comment.id }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Acknowledge the command
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST --silent \
            "repos/$GH_REPO/issues/comments/$COMMENT_ID/reactions" -f content=eyes || true

      - name: Resolve the immutable PR target
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch=$(gh pr view "$PR" --json headRefName --jq .headRefName)
          fork=$(gh pr view "$PR" --json isCrossRepository --jq .isCrossRepository)
          sha=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
          if [ "$fork" = "true" ]; then
            echo "::error::fix commands are not supported for fork pull requests"
            exit 1
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Dispatch the isolated worker
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.pr.outputs.branch }}
          SHA: ${{ steps.pr.outputs.sha }}
          INSTRUCTION: ${{ github.event.comment.body }}
        run: |
          gh workflow run fix-worker.yml --ref develop \
            -f pr="$PR" \
            -f branch="$BRANCH" \
            -f sha="$SHA" \
            -f comment_id="$COMMENT_ID" \
            -f instruction="$INSTRUCTION"

      - name: Report dispatch failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "$PR" --body "Команда «исправить» не запустилась. [Лог диспетчера]($RUN_URL)."
          gh api -X POST --silent \
            "repos/$GH_REPO/issues/comments/$COMMENT_ID/reactions" -f content=confused || true
