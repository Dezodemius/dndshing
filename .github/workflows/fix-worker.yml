name: fix-worker
run-name: Fix PR #${{ inputs.pr }}

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: string
      branch:
        description: Same-repository pull request branch
        required: true
        type: string
      sha:
        description: Immutable pull request head SHA
        required: true
        type: string
      comment_id:
        description: Command comment ID
        required: true
        type: string
      instruction:
        description: Owner instruction
        required: true
        type: string

concurrency:
  group: fix-${{ inputs.pr }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  issues: read
  pull-requests: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
    env:
      GH_REPO: ${{ github.repository }}
      PR: ${{ inputs.pr }}
      BRANCH: ${{ inputs.branch }}
      BEFORE: ${{ inputs.sha }}
    steps:
      - name: Validate the pinned PR target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh pr view "$PR" --json state --jq .state)" = "OPEN"
          test "$(gh pr view "$PR" --json isCrossRepository --jq .isCrossRepository)" = "false"
          test "$(gh pr view "$PR" --json headRefName --jq .headRefName)" = "$BRANCH"
          test "$(gh pr view "$PR" --json headRefOid --jq .headRefOid)" = "$BEFORE"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fix the review remarks
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            Ты — агент-исправитель PR #${{ inputs.pr }}. Код выкачан на
            зафиксированном SHA ${{ inputs.sha }}. Ветка: ${{ inputs.branch }}.

            Дословная команда владельца:
            ---
            ${{ inputs.instruction }}
            ---

            Собери актуальные замечания через `gh pr view` и GitHub API. Уточнение
            владельца главнее списка ревьюера. Прочитай правила репозитория,
            связанную issue и релевантный код. Исправляй только подтверждённые
            замечания; ошибочные замечания объясни в отчёте.

            Проверь изменённое поведение содержательными тестами. Для backend
            обязательны `ruff check .` и `pytest`; при frontend-изменениях также
            выполни `npm ci`, `npm run test` и `npm run build` в `frontend`.

            Не создавай коммиты, не пушь и не пиши комментарии в GitHub. Оставь
            правки в working tree. Отчёт сохрани в `.claude/fix-report.md`, одна
            строка на замечание:
              - **Исправлено:** <замечание> — <что сделано, файл:строка>
              - **Не исправлено:** <замечание> — <почему>
            Если код менять не потребовалось, так и напиши одной строкой.
          claude_args: "--max-turns 100 --dangerously-skip-permissions"

      - name: Build the reviewable patch
        id: patch
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BEFORE"
          git add -N .
          # .github/** исключается жёстко: агент читает комментарии PR, а их на
          # публичном репозитории пишет кто угодно. Патч применяется и пушится
          # без чтения человеком, а воркфлоу, доехавший до ветки PR, исполнится
          # на следующем `synchronize` уже с секретами — для same-repo PR GitHub
          # берёт определение из head-ветки. Правки воркфлоу делает человек.
          git diff --binary -- . \
            ':(exclude).claude/fix-report.md' \
            ':(exclude).github' > "$RUNNER_TEMP/fix.patch"
          if [ -s .claude/fix-report.md ]; then
            cp .claude/fix-report.md "$RUNNER_TEMP/fix-report.md"
          else
            printf '%s\n' '- **Не исправлено:** агент не оставил отчёт.' > "$RUNNER_TEMP/fix-report.md"
          fi
          if [ -s "$RUNNER_TEMP/fix.patch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the patch
        uses: actions/upload-artifact@v4
        with:
          name: fix-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/fix.patch
            ${{ runner.temp }}/fix-report.md
          retention-days: 1

  apply:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read
    env:
      GH_REPO: ${{ github.repository }}
      PR: ${{ inputs.pr }}
      BRANCH: ${{ inputs.branch }}
      BEFORE: ${{ inputs.sha }}
      COMMENT_ID: ${{ inputs.comment_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download the patch
        uses: actions/download-artifact@v4
        with:
          name: fix-${{ github.run_id }}
          path: .fix-result

      - name: Revalidate the PR target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh pr view "$PR" --json state --jq .state)" = "OPEN"
          test "$(gh pr view "$PR" --json headRefName --jq .headRefName)" = "$BRANCH"
          test "$(gh pr view "$PR" --json headRefOid --jq .headRefOid)" = "$BEFORE"

      - name: Apply and commit the patch
        if: needs.prepare.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git apply --check .fix-result/fix.patch
          # Второй рубеж к исключению в `prepare`: артефакт едет между job'ами,
          # и применять его вслепую нельзя. Путь под .github/ — отказ, не фильтр.
          if git apply --numstat .fix-result/fix.patch | cut -f3 | grep -q '^\.github/'; then
            echo "::error::patch touches .github/ — отклонён"
            exit 1
          fi
          git apply --index .fix-result/fix.patch
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix PR #$PR review feedback"

      - name: Push with an atomic lease
        if: needs.prepare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git push --force-with-lease="refs/heads/$BRANCH:$BEFORE" \
            origin "HEAD:refs/heads/$BRANCH"

      - name: Report success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body=$(mktemp)
          if [ "${{ needs.prepare.outputs.changed }}" = "true" ]; then
            after=$(git rev-parse HEAD)
            printf '### Правки внесены (`%s`)\n\nРевьюер перепроверит замечания и отпишется здесь же.\n\n' "${after:0:7}" > "$body"
          else
            printf '### Код не изменился\n\nАгент не нашёл правок для отправки.\n\n' > "$body"
          fi
          cat .fix-result/fix-report.md >> "$body"
          gh pr comment "$PR" --body-file "$body"
          gh api -X POST --silent \
            "repos/$GH_REPO/issues/comments/$COMMENT_ID/reactions" -f content=rocket || true

  report-failure:
    needs: [prepare, apply]
    if: always() && (needs.prepare.result == 'failure' || needs.apply.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_REPO: ${{ github.repository }}
      PR: ${{ inputs.pr }}
      COMMENT_ID: ${{ inputs.comment_id }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Report worker failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "$PR" --body "Команда «исправить» упала — правки не отправлены. [Лог прогона]($RUN_URL)."
          gh api -X POST --silent \
            "repos/$GH_REPO/issues/comments/$COMMENT_ID/reactions" -f content=confused || true
