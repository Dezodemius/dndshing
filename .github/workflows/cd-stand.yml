# .github/workflows/cd-stand.yml
#
# CD стенда: деплой develop на тестовый сервер timeweb.cloud. В отличие от
# cd.yml (прод, self-hosted runner на самом сервере) стенд едет с обычного
# ubuntu-latest по SSH — раннер на нём не регистрируется: стенд пересоздаётся,
# адрес меняется, поэтому он задаётся переменными репозитория, а не зашит в
# воркфлоу.
#
# Переменные (Settings → Secrets and variables → Actions):
#   vars.STAND_HOST            — IP или домен стенда                 (обязательна)
#   vars.STAND_SSH_KNOWN_HOSTS — вывод `ssh-keyscan -p 22 <IP>`      (обязательна)
#   secrets.STAND_SSH_KEY      — приватный ключ для входа на стенд   (обязательна)
#   vars.STAND_USER            — пользователь SSH (по умолчанию root, как у timeweb)
#   vars.STAND_SSH_PORT        — порт SSH (по умолчанию 22)
#   vars.STAND_PATH            — каталог кода на сервере (по умолчанию /opt/dnd-stand)
#
# Секретов стенда в репозитории нет (правило 12 CLAUDE.md): .env с POSTGRES_*,
# JWT_SECRET_KEY и прочим лежит на сервере в STAND_PATH и деплоем не
# перезаписывается. docker-compose.yml требует эти переменные через
# ${VAR:?...} без дефолтов, так что без файла деплой упадёт сам, а не поднимет
# стенд на известных из репозитория кредах.

name: cd-stand

on:
  push:
    branches: [develop]
    # Документация и бэклог едут в develop отдельными пушами (plan.yml, правки
    # промтов) и на работающий стенд не влияют — деплой на них не нужен.
    paths-ignore:
      - "**.md"
      - ".claude/docs/**"
  # Ручной запуск: в UI выбирается ветка, поэтому на стенд можно выложить
  # любую feat/dnd-NNN, не мержа её в develop.
  workflow_dispatch:

# Стенд один: параллельные деплои подрались бы за docker compose и миграции.
# Очередь, а не отмена — как в cd.yml.
concurrency:
  group: cd-stand
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STAND_HOST: ${{ vars.STAND_HOST }}
      STAND_USER: ${{ vars.STAND_USER || 'root' }}
      STAND_SSH_PORT: ${{ vars.STAND_SSH_PORT || '22' }}
      STAND_PATH: ${{ vars.STAND_PATH || '/opt/dnd-stand' }}
      STAND_SSH_KNOWN_HOSTS: ${{ vars.STAND_SSH_KNOWN_HOSTS }}
      # Тот же build arg, что и в проде: попадает в version.json образа фронта
      # и служит маркером того, что стенд отдаёт именно этот коммит.
      APP_COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Check stand configuration
        # Пустая переменная иначе доедет до ssh и упадёт невнятной ошибкой
        # соединения — проверяем до того, как что-то произойдёт с сервером.
        env:
          STAND_SSH_KEY: ${{ secrets.STAND_SSH_KEY }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "$STAND_HOST" ]; then
            echo "::error::не задана переменная STAND_HOST (Settings → Secrets and variables → Actions → Variables): IP стенда"
            missing=1
          fi
          if [ -z "${STAND_SSH_KEY:-}" ]; then
            echo "::error::не задан секрет STAND_SSH_KEY: приватный ключ для входа на стенд"
            missing=1
          fi
          if [ -z "$STAND_SSH_KNOWN_HOSTS" ]; then
            echo "::error::не задана переменная STAND_SSH_KNOWN_HOSTS. Получить: ssh-keyscan -p ${STAND_SSH_PORT} ${STAND_HOST:-<IP>}"
            missing=1
          fi
          exit "$missing"

      - name: Configure SSH
        env:
          STAND_SSH_KEY: ${{ secrets.STAND_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$STAND_SSH_KEY" > ~/.ssh/stand_key
          chmod 600 ~/.ssh/stand_key
          # Ключ хоста пинится переменной, а не добирается ssh-keyscan'ом на
          # лету: keyscan доверяет тому, кто ответил, и деплой вместе с доступом
          # к серверу уехал бы к любому, кто перехватил адрес. Пересоздал
          # стенд — обновил STAND_SSH_KNOWN_HOSTS.
          printf '%s\n' "$STAND_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host stand
            HostName ${STAND_HOST}
            User ${STAND_USER}
            Port ${STAND_SSH_PORT}
            IdentityFile ~/.ssh/stand_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            BatchMode yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Upload sources
        # git archive, а не rsync: на сервер уезжает ровно содержимое коммита —
        # без .git, node_modules и локального мусора, и без зависимости от
        # rsync, которого на свежей машине может не быть.
        #
        # Каталог перед распаковкой чистится, кроме .env и
        # docker-compose.override.yml: иначе удалённый в коммите файл остался бы
        # на сервере и уехал в образ при build. Оба сохранённых файла —
        # конфигурация конкретного стенда, она живёт на сервере, а не в
        # репозитории. Данные БД лежат в docker-волюме pg_data, а не в
        # каталоге, — чистка их не трогает.
        run: |
          set -euo pipefail
          git archive --format=tar HEAD | gzip \
            | ssh stand "set -eu
                mkdir -p '${STAND_PATH}'
                find '${STAND_PATH}' -mindepth 1 -maxdepth 1 \
                  ! -name '.env' ! -name 'docker-compose.override.yml' \
                  -exec rm -rf {} +
                tar -xzf - -C '${STAND_PATH}'"

      - name: Build images
        run: ssh stand "cd '${STAND_PATH}' && APP_COMMIT_SHA='${APP_COMMIT_SHA}' docker compose build"

      - name: Run database migrations
        # Тот же образ api, что пойдёт на стенд; db поднимется по depends_on
        # (condition: service_healthy) до старта команды.
        run: ssh stand "cd '${STAND_PATH}' && docker compose run --rm api alembic upgrade head"

      - name: Deploy
        run: ssh stand "cd '${STAND_PATH}' && APP_COMMIT_SHA='${APP_COMMIT_SHA}' docker compose up -d"

      - name: Check the deployed containers
        # Проверка изнутри сервера: контейнеры публикуются только на 127.0.0.1.
        # Набор проверок — как в cd.yml: живой /healthz через nginx-прокси
        # (значит, поднялся и api), отданный SPA-шелл и маркер коммита в
        # version.json (значит, отдаётся именно этот деплой, а не прошлый).
        #
        # Скрипт уезжает на stdin (`sh -s`), а не строкой в кавычках: иначе
        # кавычки внутри grep пришлось бы экранировать в три слоя.
        run: |
          set -euo pipefail
          ssh stand "sh -s '${STAND_PATH}' '${APP_COMMIT_SHA}'" <<'REMOTE' || { echo "::error::stand did not become healthy after deploy"; exit 1; }
          set -eu
          cd "$1"
          url="http://$(docker compose port frontend 80)"
          for i in $(seq 1 20); do
            version=$(curl -fsS "$url/version.json" 2>/dev/null || true)
            root=$(curl -fsS "$url/" 2>/dev/null || true)
            if curl -fsS "$url/healthz" >/dev/null 2>&1 \
              && printf '%s' "$root" | grep -Fq '<div id="root"></div>' \
              && printf '%s' "$version" | grep -Fq "\"$2\""; then
              echo "frontend, API proxy and commit marker are healthy"
              exit 0
            fi
            echo "stand not ready yet ($i/20), retrying in 3s..."
            sleep 3
          done
          exit 1
          REMOTE

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/stand_key ~/.ssh/config
