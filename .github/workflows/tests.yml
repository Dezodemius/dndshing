name: Tests

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  # ── Unit tests (no server needed) ──────────────────────────────────────────
  unit:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm test

  # ── E2e visual tests (Playwright) ──────────────────────────────────────────
  e2e:
    name: E2e tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e
        env:
          # Minimal env so Next.js starts. /test-sheet bypasses Supabase middleware,
          # so these values are never actually used for network calls in our test page.
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      # When snapshots don't exist yet (first run) or need updating,
      # upload them so they can be downloaded and committed.
      # Upload snapshots so they can be downloaded and committed on first run
      # (or after running test:e2e:update to regenerate baselines).
      - name: Upload updated snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: tests/snapshots/
          retention-days: 7
