# .github/workflows/review.yml
#
# Независимое ревью каждого PR в develop. Запускается при создании PR
# и при добавлении коммитов. Ревьюер = Opus (одно ревью в день квоту
# не исчерпает), контекст свежий — ловит слепые зоны автора-агента.
# Результат — комментарии в PR; человек-владелец остаётся арбитром.
#
# Он же перепроверяет правки после команды «исправить» (fix.yml): тот пушит
# в ветку PR под GH_PAT, PR получает `synchronize` — и этот воркфлоу поднимается
# сам. Отсюда шаг 2 промта: по каждому прежнему замечанию сказать, закрыто оно
# или нет. Своего ревьюера fix.yml намеренно не заводит — было бы два ревью
# и два вердикта на один пуш.

name: review

on:
  pull_request:
    types: [opened, synchronize]
    branches: [develop]

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write   # claude-code-action@v1 обменивает OAuth-токен через OIDC

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Review PR
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Ты — независимый ревьюер PR #${{ github.event.pull_request.number }}.
            Автор — другой агент; твоя ценность в свежем взгляде.

            1. Прочитай .claude/docs/CLAUDE.md, .claude/docs/ARCHITECTURE.md,
               связанную ишью (номер — в теле PR после "Closes #") и её секцию
               в .claude/docs/BACKLOG.md. Затем полный diff PR.
            2. ПРЕЖНИЕ ЗАМЕЧАНИЯ. Подними свои прошлые комментарии в этом PR:
               gh pr view ${{ github.event.pull_request.number }} --comments и
               gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments.
               Если ревью уже было — пройди по КАЖДОМУ незакрытому замечанию и
               скажи, закрыто ли оно текущим кодом:
                 ✅ исправлено — <как именно, файл:строка>
                 ⚠️ частично — <что осталось>
                 ❌ не исправлено — <что не так>
               Судишь по КОДУ, а не по отчёту исправлявшего агента: «исправлено»
               ставь, только если сам видишь правку в файлах. Проверь и то, что
               правка не сломала соседнее (тесты, миграции, права доступа).
               Первое ревью в PR — раздел просто пропусти.
            3. НОВЫЕ ЗАМЕЧАНИЯ. Проверь по приоритету:
               a) безопасность — скилл security-review, особенно IDOR
                  и транзакции с деньгами;
               b) соответствие критериям приёмки задачи — каждый пункт;
               c) выход за скоуп: код, которого задача не требовала,
                  или что-то из фазы 2 (BR §6);
               d) корректность тестов: проверяют ли они приёмку или
                  written-to-pass;
               e) скилл code-style — только существенные нарушения.
            4. Итог — ОДИН комментарий к PR (gh pr comment):
               «Вердикт: approve | needs work», затем раздел «Прежние
               замечания» (если они были), затем новые — по убыванию
               важности, с путями файлов и строками. Не более 10 замечаний,
               без воды. Мелкие вкусовые придирки не пиши. Все прежние
               замечания закрыты и новых нет — так и напиши: вердикт approve.
            5. Код НЕ правь, ничего не пушь, PR не мержи и не закрывай.
          claude_args: "--max-turns 30 --model claude-opus-4-8 --dangerously-skip-permissions"