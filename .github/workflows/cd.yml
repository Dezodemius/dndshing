# .github/workflows/cd.yml
#
# CD: деплой на прод-сервер по мержу в main. Собирает образы на обычном
# hosted-раннере, пушит в GHCR (ghcr.io/dezodemius/dndshing-{api,frontend}),
# затем по SSH разворачивает на прод-сервере (app01, timeweb.cloud,
# dndshing.ru): pull образов, миграции, docker compose up -d, healthz-гейт.
#
# Раньше сборка шла локально на self-hosted раннере, зарегистрированном на
# самом прод-сервере, — но раннер так и не был зарегистрирован, и деплой не
# ездил. Эта версия ходит на сервер по SSH с hosted-раннера, а образы едут
# через GHCR: прод не собирает ничего сам, только тянет готовые, исходников
# у него нет.
#
# Адрес сервера и его ключ хоста лежат в СЕКРЕТАХ (PROD_HOST,
# PROD_SSH_KNOWN_HOSTS), а не в переменных, и подставляются пошагово, а не в
# workflow-level env. Репозиторий публичный, а Actions печатает блок env
# каждого шага в лог: переменная попала бы в него открытым текстом и выдала
# бы origin за Cloudflare всякому, кто откроет прогон. Секрет маскируется.
# По той же причине здесь нет ни echo с адресом, ни ssh -v.
#
# Секретов прода в репозитории нет (правило 12 CLAUDE.md): .env с реальными
# POSTGRES_*, JWT_SECRET_KEY и т.д. лежит на сервере в PROD_PATH, а не в git.
# docker-compose.yml требует эти переменные через ${VAR:?...} без дефолтов,
# так что при отсутствии файла деплой упадёт сам, а не подставит секрет по
# умолчанию.
#
# Публичный HTTPS (dndshing.ru) на сервере пока не настроен — nginx
# установлен, но не сконфигурирован под этот домен, и это отдельный
# инфраструктурный шаг (TLS/Cloudflare), не часть этого воркфлоу. Поэтому
# здесь нет проверки публичного сайта, только проверка контейнеров изнутри
# сервера.
#
# Неудачный healthz-гейт откатывает ПРИЛОЖЕНИЕ (контейнеры) на последний
# отметившийся здоровым тег из ${PROD_PATH}/.last_good_tag, но не миграции —
# откат БД небезопасен и не предполагается (схема должна расти
# совместимо вперёд). Первый деплой без .last_good_tag откатывать некуда:
# просто падает, как раньше.

name: cd

on:
  push:
    branches: [main]

concurrency:
  group: cd-prod
  cancel-in-progress: false

env:
  IMAGE_TAG: ${{ github.sha }}
  PROD_USER: ${{ vars.PROD_USER || 'root' }}
  PROD_SSH_PORT: ${{ vars.PROD_SSH_PORT || '22' }}
  PROD_PATH: ${{ vars.PROD_PATH || '/opt/dnd-prod' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/dezodemius/dndshing-api:${{ github.sha }}
            ghcr.io/dezodemius/dndshing-api:main
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            APP_COMMIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/dezodemius/dndshing-frontend:${{ github.sha }}
            ghcr.io/dezodemius/dndshing-frontend:main
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: Production
      url: https://dndshing.ru
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Check prod configuration
        # Пустая переменная иначе доедет до ssh и упадёт невнятной ошибкой
        # соединения — проверяем до того, как что-то произойдёт с сервером.
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${PROD_HOST:-}" ]; then
            echo "::error::не задан секрет PROD_HOST: адрес прод-сервера"
            missing=1
          fi
          if [ -z "${PROD_SSH_KEY:-}" ]; then
            echo "::error::не задан секрет PROD_SSH_KEY: приватный ключ для входа на сервер"
            missing=1
          fi
          if [ -z "${PROD_SSH_KNOWN_HOSTS:-}" ]; then
            echo "::error::не задан секрет PROD_SSH_KNOWN_HOSTS: вывод ssh-keyscan -p 22 IP"
            missing=1
          fi
          exit "$missing"

      - name: Configure SSH
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/prod_key
          chmod 600 ~/.ssh/prod_key
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host prod
            HostName ${PROD_HOST}
            User ${PROD_USER}
            Port ${PROD_SSH_PORT}
            IdentityFile ~/.ssh/prod_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            BatchMode yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Read previous release
        # Пусто на самом первом деплое (файла ещё нет) — откатывать в этом
        # случае некуда, шаг отката ниже это учитывает.
        id: previous
        run: |
          set -euo pipefail
          tag=$(ssh prod "cat '${PROD_PATH}/.last_good_tag' 2>/dev/null || true")
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Upload compose file
        # Прод не собирает образы и не хранит исходники — только
        # docker-compose.yml и файл, который он монтирует для db. .env на
        # сервере этим шагом не трогается: он не входит в архив, а каталог
        # не чистится — на прод едут только два этих файла.
        run: |
          set -euo pipefail
          tar -czf - docker-compose.yml docker/postgres/init-test-db.sh \
            | ssh prod "mkdir -p '${PROD_PATH}' && tar -xzf - -C '${PROD_PATH}'"

      - name: Pull images
        # GITHUB_TOKEN — короткоживущий, уходит по стандартному вводу ssh, а
        # не аргументом команды (не оседает в истории/списке процессов), и
        # логаут сразу после pull не оставляет его в ~/.docker/config.json на
        # сервере между деплоями.
        run: |
          set -euo pipefail
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" \
            | ssh prod "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          ssh prod "cd '${PROD_PATH}' && IMAGE_TAG='${IMAGE_TAG}' docker compose pull"
          ssh prod "docker logout ghcr.io"

      - name: Run database migrations
        run: ssh prod "cd '${PROD_PATH}' && IMAGE_TAG='${IMAGE_TAG}' docker compose run --rm api alembic upgrade head"

      - name: Deploy
        run: ssh prod "cd '${PROD_PATH}' && IMAGE_TAG='${IMAGE_TAG}' docker compose up -d"

      - name: Check the deployed containers
        # Проверка изнутри сервера: контейнеры публикуются только на
        # 127.0.0.1. Публичный dndshing.ru здесь не проверяется — см.
        # комментарий в шапке файла.
        id: health
        run: |
          set -euo pipefail
          ssh prod "sh -s '${PROD_PATH}' '${IMAGE_TAG}'" <<'REMOTE' || { echo "::error::deployed containers did not become healthy"; exit 1; }
          set -eu
          cd "$1"
          url="http://$(docker compose port frontend 80)"
          for i in $(seq 1 20); do
            version=$(curl -fsS "$url/version.json" 2>/dev/null || true)
            root=$(curl -fsS "$url/" 2>/dev/null || true)
            if curl -fsS "$url/healthz" >/dev/null 2>&1 \
              && printf '%s' "$root" | grep -Fq '<div id="root"></div>' \
              && printf '%s' "$version" | grep -Fq "\"$2\""; then
              echo "frontend, API proxy and commit marker are healthy"
              exit 0
            fi
            echo "containers not ready yet ($i/20), retrying in 3s..."
            sleep 3
          done
          exit 1
          REMOTE

      - name: Record last-good release
        # Не выполняется, если предыдущий шаг упал (дефолт GHA — шаг без
        # своего if пропускается, если джоба уже провалилась).
        run: ssh prod "printf '%s' '${IMAGE_TAG}' > '${PROD_PATH}/.last_good_tag'"

      - name: Roll back to the previous release
        # Откатывает контейнеры на последний здоровый тег — не миграции (см.
        # комментарий в шапке файла). Джоба всё равно останется красной:
        # неудачный healthz — сигнал, что нужно смотреть, что случилось,
        # откат только не оставляет прод лежать до этого разбирательства.
        if: failure() && steps.health.outcome == 'failure' && steps.previous.outputs.tag != ''
        run: |
          set -euo pipefail
          prev="${{ steps.previous.outputs.tag }}"
          echo "::warning::health check failed for ${IMAGE_TAG}, rolling back app containers to ${prev} (database migrations are not reverted)"
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" \
            | ssh prod "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          ssh prod "cd '${PROD_PATH}' && IMAGE_TAG='${prev}' docker compose pull && IMAGE_TAG='${prev}' docker compose up -d"
          ssh prod "docker logout ghcr.io"

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/prod_key ~/.ssh/config
