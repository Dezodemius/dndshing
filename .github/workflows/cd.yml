# .github/workflows/cd.yml
#
# CD: деплой на прод-сервер по мержу в main. Работает на self-hosted
# раннере, зарегистрированном владельцем на самом прод-сервере (регистрация —
# инфраструктурный шаг вне репозитория), поэтому checkout на этот раннер и
# есть "доставка" кода: отдельного шага копирования на сервер не нужно.
#
# Секретов прода в репозитории нет (правило 12 CLAUDE.md): .env с реальными
# POSTGRES_* лежит на сервере в рабочей директории раннера, не в git.
# docker-compose.yml уже требует эти переменные через ${VAR:?...} без
# дефолтов, так что при отсутствии файла деплой упадёт сам, а не подставит
# секрет по умолчанию.

name: cd

on:
  push:
    branches: [main]

# Раннер персистентный (это и есть прод-сервер) — параллельный деплой поверх
# ещё не завершившегося опасен для docker compose и БД, поэтому очередь, а не
# отмена: второй пуш в main должен доехать, а не потерять деплой.
concurrency:
  group: cd-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 20
    environment:
      name: Production
      url: https://dndshing.ru
    env:
      APP_COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # clean: false — не затирать .env в рабочей директории раннера.
          # Дефолтный git clean -ffdx удалил бы его перед каждым чекаутом.
          clean: false

      - name: Clean stale workspace files
        # The runner is persistent, so keep only the server-owned environment
        # and the static release currently served by the host nginx.
        run: >-
          git clean -ffdx
          -e /.env
          -e /frontend/dist/
          -e /frontend/dist.previous/

      - name: Build images
        run: docker compose build

      - name: Run database migrations
        # Тот же образ api, что пойдёт в прод; db поднимется по depends_on
        # (condition: service_healthy) до старта команды.
        run: docker compose run --rm api alembic upgrade head

      - name: Deploy
        run: docker compose up -d

      - name: Check the deployed containers
        run: |
          set -euo pipefail
          frontend_url="http://$(docker compose port frontend 80)"
          for i in $(seq 1 20); do
            version=$(curl -fsS "$frontend_url/version.json" 2>/dev/null || true)
            root=$(curl -fsS "$frontend_url/" 2>/dev/null || true)
            if curl -fsS "$frontend_url/healthz" >/dev/null \
              && grep -Fq '<div id="root"></div>' <<< "$root" \
              && grep -Fq "\"$GITHUB_SHA\"" <<< "$version"; then
              echo "frontend, API proxy, and commit marker are healthy"
              exit 0
            fi
            echo "containers not ready yet ($i/20), retrying in 3s..."
            sleep 3
          done
          echo "::error::deployed containers did not become healthy"
          exit 1

      - name: Publish static assets for the host nginx
        id: static
        run: |
          set -euo pipefail
          target="$GITHUB_WORKSPACE/frontend/dist"
          staged="$target.next"
          previous="$target.previous"
          image=$(docker compose images -q frontend)
          container=$(docker create "$image")
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT

          rm -rf "$staged" "$previous"
          mkdir -p "$staged"
          docker cp "$container:/usr/share/nginx/html/." "$staged/"
          grep -Fq "\"$GITHUB_SHA\"" "$staged/version.json"

          if [ -d "$target" ]; then
            mv "$target" "$previous"
          fi
          if ! mv "$staged" "$target"; then
            [ ! -d "$previous" ] || mv "$previous" "$target"
            exit 1
          fi
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Check the public site
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            version=$(curl -fsS -H 'Cache-Control: no-cache' \
              "https://dndshing.ru/version.json?commit=$GITHUB_SHA" 2>/dev/null || true)
            if grep -Fq "\"$GITHUB_SHA\"" <<< "$version" \
              && curl -fsS https://dndshing.ru/api/v1/auth/oauth/providers >/dev/null; then
              echo "dndshing.ru serves commit $GITHUB_SHA"
              exit 0
            fi
            echo "public site has not switched yet ($i/20), retrying in 3s..."
            sleep 3
          done
          echo "::error::dndshing.ru does not serve commit $GITHUB_SHA"
          exit 1

      - name: Remove the previous static release
        run: rm -rf "$GITHUB_WORKSPACE/frontend/dist.previous"

      - name: Restore static assets after a failed public check
        if: failure() && steps.static.outputs.published == 'true'
        run: |
          set -euo pipefail
          target="$GITHUB_WORKSPACE/frontend/dist"
          previous="$target.previous"
          if [ -d "$previous" ]; then
            rm -rf "$target.failed"
            [ ! -d "$target" ] || mv "$target" "$target.failed"
            mv "$previous" "$target"
            rm -rf "$target.failed"
            echo "Restored the previous static release"
          fi
