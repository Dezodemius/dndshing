name: Баг
description: Сообщить об ошибке.
title: "[BUG] "
# Только `bug`. Метки очереди шаблон не ставит намеренно: репозиторий публичный,
# а очередную метку в этом проекте вешает человек после прочтения заявки — иначе
# текст любого постороннего попадал бы в автоматику от имени владельца.
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Чем точнее шаги воспроизведения — тем быстрее баг получится починить.

  - type: textarea
    id: description
    attributes:
      label: Что сломано
      description: Коротко, в чём проблема.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Шаги воспроизведения
      description: По пунктам — так, чтобы агент мог повторить баг без уточняющих вопросов.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
      description: Текст ошибки, стектрейс, скриншот — что есть.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Область
      description: Необязательно — помогает агенту быстрее найти нужный модуль.
      options:
        - backend
        - frontend
        - infra
        - docs
        - не знаю
    validations:
      required: false
